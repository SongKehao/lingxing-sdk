[project]
name = "lingxing-sdk"
version = "0.7.0"
description = "领星 ERP OpenAPI Python SDK - Typed, async, Pydantic models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SongKehao"},
]
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pycryptodome>=3.20.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sync = ["nest-asyncio>=1.5.0"]
metrics = ["prometheus-client>=0.20.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "nest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingxing"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/lingxing/models/requests/*" = ["W293", "W291", "F403", "F401"]
"src/lingxing/models/responses/*" = ["W293", "W291", "F403", "F401"]
"src/lingxing/endpoints/*" = ["W293", "W291"]
"tests/*" = ["F403", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# codegen 生成的模型层：允许缺失注解 + 字段重名（codegen 固有，运行时无害）
[[tool.mypy.overrides]]
module = "lingxing.models.*"
disallow_untyped_defs = false
disable_error_code = ["no-redef"]

# 历史代码参数标注债务（渐进补齐，登记 open-questions）：高层客户端薄封装 + 加密工具
[[tool.mypy.overrides]]
module = ["lingxing.client", "lingxing.core.aes"]
disallow_untyped_defs = false
