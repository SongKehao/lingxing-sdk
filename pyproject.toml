[project]
name = "lingxing-sdk"
version = "0.5.0"
description = "领星 ERP OpenAPI Python SDK - Typed, async, Pydantic models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SongKehao"},
]
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pycryptodome>=3.20.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingxing"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/lingxing/models/requests/*" = ["W293", "W291", "F403", "F401"]
"src/lingxing/models/responses/*" = ["W293", "W291", "F403", "F401"]
"src/lingxing/endpoints/*" = ["W293", "W291"]
"tests/*" = ["F403", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
